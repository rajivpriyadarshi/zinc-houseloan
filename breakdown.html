<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Funding Breakdown - Zinc</title>
  <link rel="stylesheet" href="breakdown.css">
</head>
<body>
  <section class="breakdown-page">
    <div class="hero-breakdown-scene">
      <div class="stack-cluster">
        <div class="stack-side-label">
          <span class="stack-side-dot stack-side-dot-top"></span>
          <div class="stack-side-line"></div>
          <span class="stack-side-dot stack-side-dot-bottom"></span>
          <div class="stack-side-pill">
            <span class="stack-side-value" id="breakdown-loan">3 Cr</span>
            <span class="stack-side-text">Loan amount</span>
          </div>
        </div>

        <div class="stack-visual">
          <svg class="stack-block stack-base-tall" id="green-tall-svg" viewBox="0 0 240 860" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path id="gt-top" d="M1 72L120 144L239 72L120 1Z" fill="#0D1F16"/>
            <path id="gt-left" d="M1 72V789L120 858V144L1 72Z" fill="#153225"/>
            <path id="gt-right" d="M239 72V789L120 858V144L239 72Z" fill="#143020"/>
            <path id="gt-top-s" d="M1 72L120 144L239 72L120 1Z" stroke="#F2F2F2" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" fill="none"/>
            <path id="gt-left-edge-d" d="M1 72V307" stroke="#F2F2F2" stroke-width="2" stroke-dasharray="6 4"/>
            <path id="gt-right-edge-d" d="M239 72V307" stroke="#F2F2F2" stroke-width="2" stroke-dasharray="6 4"/>
            <path id="gt-center-edge-d" d="M120 144V379" stroke="#F2F2F2" stroke-width="2" stroke-dasharray="6 4"/>
            <path id="gt-left-edge-s" d="M1 307V789" stroke="#F2F2F2" stroke-width="2"/>
            <path id="gt-right-edge-s" d="M239 307V789" stroke="#F2F2F2" stroke-width="2"/>
            <path id="gt-center-edge-s" d="M120 379V858" stroke="#F2F2F2" stroke-width="2"/>
            <path id="gt-bottom" d="M1 789L120 858L239 789" stroke="#F2F2F2" stroke-width="2" stroke-linejoin="round" fill="none"/>
          </svg>
          <img class="stack-block stack-base" src="/block-green.svg" alt="Loan block">
          <svg class="stack-block stack-mid stack-lower" id="red-lower-svg" viewBox="0 0 237 231" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path class="red-face-fill" d="M2 70L122 142L237 71L120 0L2 70Z" fill="#461616"/>
            <path class="red-face-fill" d="M2 70V160L122 231V142L2 70Z" fill="#461616"/>
            <path class="red-face-fill" d="M237 71V160L120 231V142L237 71Z" fill="#461616"/>
            <path class="red-dotted" d="M2 70V160L122 231V142L2 70L120 0L237 71V160L120 231V142L237 71" stroke="#F2F2F2" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" fill="none"/>
            <path class="red-solid" d="M2 70V160L122 231V142L2 70L120 0L237 71V160L120 231V142L237 71" stroke="#F2F2F2" stroke-width="2" stroke-linejoin="round" fill="none"/>
          </svg>
          <svg class="stack-block stack-mid stack-middle" id="red-middle-svg" viewBox="0 0 237 231" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path class="red-face-fill" d="M2 70L122 142L237 71L120 0L2 70Z" fill="#461616"/>
            <path class="red-face-fill" d="M2 70V160L122 231V142L2 70Z" fill="#461616"/>
            <path class="red-face-fill" d="M237 71V160L120 231V142L237 71Z" fill="#461616"/>
            <path class="red-dotted" d="M2 70V160L122 231V142L2 70L120 0L237 71V160L120 231V142L237 71" stroke="#F2F2F2" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" fill="none"/>
            <path class="red-solid" d="M2 70V160L122 231V142L2 70L120 0L237 71V160L120 231V142L237 71" stroke="#F2F2F2" stroke-width="2" stroke-linejoin="round" fill="none"/>
          </svg>
          <svg class="stack-block stack-top" id="red-top-svg" viewBox="0 0 237 181" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path class="red-face-fill" d="M2 66L117 0L237 67L120 136L2 66Z" fill="#2A080B"/>
            <path class="red-face-fill" d="M2 66V111L122 181V136L2 66Z" fill="#461616"/>
            <path class="red-face-fill" d="M237 67V111L120 181V136L237 67Z" fill="#461616"/>
            <path class="red-dotted" d="M2 66V111L122 181V136L2 66L117 0L237 67V111L120 181V136L237 67" stroke="#F2F2F2" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" fill="none"/>
            <path class="red-solid" d="M2 66V111L122 181V136L2 66L117 0L237 67V111L120 181V136L237 67" stroke="#F2F2F2" stroke-width="2" stroke-linejoin="round" fill="none"/>
          </svg>
        </div>

        <div class="stack-breakdown">
          <div class="stack-row">
            <span class="stack-dot"></span>
            <div class="stack-pill">
              <span class="stack-pill-value" id="breakdown-stamp">8 L</span>
              <span class="stack-pill-label">Stamp duty</span>
            </div>
          </div>
          <div class="stack-row">
            <span class="stack-dot"></span>
            <div class="stack-pill">
              <span class="stack-pill-value" id="breakdown-interior">20 L</span>
              <span class="stack-pill-label">Interior cost</span>
            </div>
          </div>
          <div class="stack-row">
            <span class="stack-dot"></span>
            <div class="stack-pill">
              <span class="stack-pill-value" id="breakdown-downpayment">20 L</span>
              <span class="stack-pill-label">Down-payment</span>
            </div>
          </div>
        </div>
      </div>

      <div class="hero-summary">
        <div class="summary-bracket"></div>
        <div class="hero-amount">
          <span class="hero-amount-lead">You still need</span>
          <h1 class="hero-amount-line">
            <span class="hero-amount-value" id="hero-amount">1.23 Cr</span>
            <span class="hero-amount-suffix">to get in your house</span>
          </h1>
        </div>
      </div>

      <button id="continue-btn" class="continue-btn">Continue</button>
    </div>
  </section>

  <script>
    if (!sessionStorage.getItem('zinc-flow-started')) {
      window.location.href = '/';
    }
  </script>
  <script type="module" src="breakdown.js"></script>
</body>
</html>
