<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Funding Breakdown - Zinc</title>
  <link rel="stylesheet" href="breakdown.css">
</head>
<body>
  <section class="breakdown-page">
    <div class="hero-breakdown-scene">
      <div class="stack-cluster">
        <div class="stack-side-label">
          <span class="stack-side-dot stack-side-dot-top"></span>
          <div class="stack-side-line"></div>
          <span class="stack-side-dot stack-side-dot-bottom"></span>
          <div class="stack-side-pill">
            <span class="stack-side-value" id="breakdown-loan">3 Cr</span>
            <span class="stack-side-text">Property cost</span>
          </div>
        </div>

        <div class="stack-visual">
          <svg class="stack-block stack-base-tall" id="green-tall-svg" viewBox="0 0 240 860" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="green-grad" x1="0%" y1="0%" x2="80%" y2="100%">
                <stop offset="5.83%" stop-color="rgba(255, 193, 92, 0.58)"/>
                <stop offset="100%" stop-color="rgba(1, 87, 60, 0.58)"/>
              </linearGradient>
            </defs>
            <path id="gt-top" d="M1 307L120 379L239 307L120 236Z" fill="none"/>
            <path id="gt-left" d="M1 307V789L120 858V379L1 307Z" fill="none"/>
            <path id="gt-right" d="M239 307V789L120 858V379L239 307Z" fill="none"/>
            <defs>
              <clipPath id="green-80-clip">
                <polygon id="green-80-clip-poly" points="0,860 120,930 240,860 240,1800 0,1800"/>
              </clipPath>
              <clipPath id="solid-20-clip">
                <rect id="solid-20-clip-rect" x="0" y="0" width="240" height="860"/>
              </clipPath>
            </defs>
            <g clip-path="url(#green-80-clip)">
              <path id="gt-80-left" d="M1 403V789L120 858V475L1 403Z" fill="url(#green-grad)"/>
              <path id="gt-80-right" d="M239 403V789L120 858V475L239 403Z" fill="url(#green-grad)"/>
            </g>
            <g clip-path="url(#solid-20-clip)">
              <path id="gt-top-s" d="M1 307L120 379L239 307L120 236Z" stroke="#F2F2F2" stroke-width="2" stroke-linejoin="round" fill="none"/>
              <path id="gt-left-edge-s" d="M1 307V789" stroke="#F2F2F2" stroke-width="2"/>
              <path id="gt-right-edge-s" d="M239 307V789" stroke="#F2F2F2" stroke-width="2"/>
              <path id="gt-center-edge-s" d="M120 379V858" stroke="#F2F2F2" stroke-width="2"/>
              <path id="gt-bottom" d="M1 789L120 858L239 789" stroke="#F2F2F2" stroke-width="2" stroke-linejoin="round" fill="none"/>
            </g>
            <!-- 20% down-payment overlay -->
            <defs>
              <linearGradient id="red-grad-overlay" x1="0%" y1="0%" x2="80%" y2="100%">
                <stop offset="5.83%" stop-color="rgba(222, 82, 31, 0.98)"/>
                <stop offset="100%" stop-color="rgba(124, 3, 3, 0.98)"/>
              </linearGradient>
              <clipPath id="red-20-clip">
                <rect id="red-20-clip-rect" x="0" y="0" width="0" height="860"/>
              </clipPath>
            </defs>
            <g clip-path="url(#red-20-clip)">
              <path id="gt-20-top" d="M1 307L120 379L239 307L120 236Z" fill="#230B0B"/>
              <path id="gt-20-left" d="M1 307V403L120 475V379L1 307Z" fill="url(#red-grad-overlay)"/>
              <path id="gt-20-right" d="M239 307V403L120 475V379L239 307Z" fill="url(#red-grad-overlay)"/>
            </g>
            <defs>
              <clipPath id="dotted-20-clip">
                <rect id="dotted-20-clip-rect" x="0" y="0" width="0" height="860"/>
              </clipPath>
            </defs>
            <g clip-path="url(#dotted-20-clip)">
              <path id="gt-20-stroke" d="M1 307L120 236L239 307V403L120 475L1 403V307L120 379V475L120 379L239 307" stroke="#F2F2F2" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" fill="none"/>
            </g>
            <path id="gt-20-bottom-solid" d="M1 403L120 475L239 403" stroke="#F2F2F2" stroke-width="2" stroke-linejoin="round" fill="none" opacity="0"/>
            <path id="gt-top-overlay" d="M1 307L120 379L239 307L120 236Z" stroke="#F2F2F2" stroke-width="2" stroke-linejoin="round" fill="none" opacity="0"/>
          </svg>
          <img class="stack-block stack-base" src="/block-green.svg" alt="Loan block">
          <svg class="stack-block stack-mid stack-lower" id="red-lower-svg" viewBox="0 0 237 202" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="red-grad-lower" x1="0%" y1="0%" x2="80%" y2="100%">
                <stop offset="5.83%" stop-color="rgba(222, 82, 31, 0.98)"/>
                <stop offset="100%" stop-color="rgba(124, 3, 3, 0.98)"/>
              </linearGradient>
            </defs>
            <path class="red-face-fill" d="M2 70L122 142L237 71L120 0L2 70Z" fill="#230B0B"/>
            <path class="red-face-fill" d="M2 70V130L120 202V142L2 70Z" fill="url(#red-grad-lower)"/>
            <path class="red-face-fill" d="M237 71V131L120 202V142L237 71Z" fill="url(#red-grad-lower)"/>
            <path d="M2 70L120 0L237 71L122 142Z" stroke="#F2F2F2" stroke-width="2" stroke-linejoin="round" fill="none"/>
            <path class="red-dotted" d="M2 70V130L120 202V142L2 70L120 0L237 71V131L120 202V142L237 71" stroke="none" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" fill="none"/>
            <path class="red-solid" d="M2 70V130L120 202V142L2 70L120 0L237 71V131L120 202V142L237 71" stroke="none" stroke-width="2" stroke-linejoin="round" fill="none"/>
          </svg>
          <svg class="stack-block stack-mid stack-middle" id="red-middle-svg" viewBox="0 0 237 284" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="red-grad-middle" x1="0%" y1="0%" x2="80%" y2="100%">
                <stop offset="5.83%" stop-color="rgba(222, 82, 31, 0.98)"/>
                <stop offset="100%" stop-color="rgba(124, 3, 3, 0.98)"/>
              </linearGradient>
            </defs>
            <path class="red-face-fill" d="M2 70L122 142L237 71L120 0L2 70Z" fill="#230B0B"/>
            <path class="red-face-fill" d="M2 70V212L120 284V142L2 70Z" fill="url(#red-grad-middle)"/>
            <path class="red-face-fill" d="M237 71V213L120 284V142L237 71Z" fill="url(#red-grad-middle)"/>
            <path d="M2 70L120 0L237 71L122 142Z" stroke="#F2F2F2" stroke-width="2" stroke-linejoin="round" fill="none"/>
            <path class="red-dotted" d="M2 70V212L120 284V142L2 70L120 0L237 71V213L120 284V142L237 71" stroke="none" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" fill="none"/>
            <path class="red-solid" d="M2 70V212L120 284V142L2 70L120 0L237 71V213L120 284V142L237 71" stroke="none" stroke-width="2" stroke-linejoin="round" fill="none"/>
          </svg>
          <svg class="stack-block stack-top" id="red-top-svg" viewBox="0 0 237 187" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="red-grad-top" x1="0%" y1="0%" x2="80%" y2="100%">
                <stop offset="5.83%" stop-color="rgba(222, 82, 31, 0.98)"/>
                <stop offset="100%" stop-color="rgba(124, 3, 3, 0.98)"/>
              </linearGradient>
            </defs>
            <path class="red-face-fill" d="M2 70L120 0L237 71L120 140L2 70Z" fill="#230B0B"/>
            <path class="red-face-fill" d="M2 70V117L120 187V140L2 70Z" fill="url(#red-grad-top)"/>
            <path class="red-face-fill" d="M237 71V118L120 187V140L237 71Z" fill="url(#red-grad-top)"/>
            <path d="M2 70L120 0L237 71L120 140Z" stroke="#F2F2F2" stroke-width="2" stroke-linejoin="round" fill="none"/>
            <path class="red-dotted" d="M2 70V117L120 187V140L2 70L120 0L237 71V118L120 187V140L237 71" stroke="none" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" fill="none"/>
            <path class="red-solid" d="M2 70V117L120 187V140L2 70L120 0L237 71V118L120 187V140L237 71" stroke="none" stroke-width="2" stroke-linejoin="round" fill="none"/>
          </svg>
        </div>

        <div class="stack-right-labels">
          <div class="stack-right-top">
            <div class="stack-right-group">
              <div class="stack-right-row stack-right-row-stamp">
                <span class="stack-right-dot"></span>
                <div class="stack-right-pill">
                  <span class="stack-right-value" id="breakdown-stamp">8 L</span>
                  <span class="stack-right-text">Stamp duty</span>
                </div>
              </div>
              <div class="stack-right-row stack-right-row-interior">
                <span class="stack-right-dot"></span>
                <div class="stack-right-pill">
                  <span class="stack-right-value" id="breakdown-interior">20 L</span>
                  <span class="stack-right-text">Interior cost</span>
                </div>
              </div>
              <div class="stack-right-row stack-right-row-dp">
                <span class="stack-right-dot"></span>
                <div class="stack-right-pill">
                  <span class="stack-right-value" id="breakdown-downpayment">20 L</span>
                  <span class="stack-right-text">Down-payment</span>
                </div>
              </div>
            </div>
            <div class="hero-summary">
              <div class="summary-bracket"></div>
              <div class="hero-amount">
                <span class="hero-amount-lead">You still need</span>
                <h1 class="hero-amount-line">
                  <span class="hero-amount-value" id="hero-amount">1.23 Cr</span>
                  <span class="hero-amount-suffix">to get in your house</span>
                </h1>
              </div>
            </div>
          </div>
          <div class="stack-right-row stack-right-row-loan">
            <span class="stack-right-dot"></span>
            <div class="stack-right-pill">
              <span class="stack-right-value" id="breakdown-homeloan">2.4 Cr</span>
              <span class="stack-right-text">Home loan</span>
            </div>
          </div>
        </div>
      </div>

      <button id="continue-btn" class="continue-btn">Continue</button>
    </div>
  </section>

  <script>
    if (!sessionStorage.getItem('zinc-flow-started')) {
      window.location.href = '/';
    }
  </script>
  <script type="module" src="breakdown.js"></script>
</body>
</html>
