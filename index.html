<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zinc - Plan Your Home Purchase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <img src="/zinc_logo.png" alt="Zinc" class="logo">
    <div class="vertical-lines"></div>
    <h1 class="title">Plan your home<br>purchase</h1>
    <p class="subtitle">Understand the real cost of buying a home and prepare your finances with confidence.</p>
    <button class="get-started-btn" id="get-started-btn">Get started</button>
  </div>

  <!-- Login Modal -->
  <div class="login-modal-overlay" id="login-modal">
    <div class="login-modal">
      <div class="login-step active" id="login-step-email">
        <h2 class="login-title">Sign in to continue</h2>
        <p class="login-subtitle">Choose Google or continue with email OTP</p>
        <button class="login-btn login-google-btn" id="google-signin-btn">Continue with Google</button>
        <div class="login-divider">OR</div>
        <div class="login-field">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="you@example.com">
        </div>
        <button class="login-btn login-secondary-btn" id="send-otp-btn">Send OTP</button>
      </div>

      <div class="login-step" id="login-step-otp">
        <h2 class="login-title">Verify OTP</h2>
        <p class="login-subtitle">Enter the 6-digit code sent to your email</p>
        <div class="login-field">
          <label>Email</label>
          <div class="login-email-row">
            <p class="login-email-chip" id="login-email-chip"></p>
            <button class="login-email-edit" id="edit-email-btn" aria-label="Edit email">✎</button>
          </div>
        </div>
        <div class="login-field">
          <label>OTP</label>
          <input type="text" id="login-otp" placeholder="Enter 6-digit OTP" maxlength="6" inputmode="numeric">
        </div>
        <button class="login-btn" id="verify-otp-btn">Verify OTP</button>
      </div>

      <p class="login-status" id="login-status" aria-live="polite"></p>
      <button class="login-skip" id="login-skip">Skip for now</button>
    </div>
  </div>

  <script type="module" src="index.js"></script>
</body>
</html>
