<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zinc - Plan Your Home Purchase</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="community-widget.css">
</head>
<body>
  <!-- Fixed Header -->
  <header class="site-header" id="site-header">
    <img src="/zinc_logo.png" alt="Zinc" class="header-logo">
    <div class="header-right">
      <span class="user-email" id="user-email"></span>
      <button class="logout-btn" id="logout-btn">Logout</button>
    </div>
  </header>

  <div class="container">
    <div class="vertical-lines"></div>
    <h1 class="title">Beyond your<br>home loan</h1>
    <p class="subtitle">Discover & compare cost-effective ways to fund down-payment, interiors, stamp duty, and more for your new home.</p>
    <button class="get-started-btn" id="get-started-btn">Get started</button>
  </div>

  <div class="fun-fact-ticker" id="fun-fact-ticker">
    <span class="fun-fact-icon">💡</span>
    <span class="fun-fact-text" id="fun-fact-text"></span>
  </div>
  <script type="module" src="index.js"></script>
  <script src="community-widget.js"></script>
</body>
</html>
