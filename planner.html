<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Value of Your House - Zinc</title>
  <link rel="stylesheet" href="planner.css">
  <link rel="stylesheet" href="/community-widget.css">
</head>
<body>
  <button class="back-btn" id="back-btn">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
  </button>

  <div class="container">
    <div class="vertical-lines"></div>

    <div class="content">
      <p class="subtitle">How much does your house cost?</p>
      <div class="amount-display" id="amount-display-container">
        <span id="amount-display" class="amount-value">₹1.00 Cr</span>
        <svg class="edit-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
      </div>

      <!-- Edit Modal -->
      <div class="edit-modal-overlay" id="edit-modal">
        <div class="edit-modal">
          <h3 class="edit-modal-title">Enter house value</h3>
          <div class="edit-modal-field">
            <span class="edit-modal-prefix">₹</span>
            <input type="text" id="edit-modal-input" class="edit-modal-input" placeholder="1,00,00,000">
          </div>
          <div class="edit-modal-actions">
            <button class="edit-modal-cancel" id="edit-modal-cancel">Cancel</button>
            <button class="edit-modal-save" id="edit-modal-save">Save</button>
          </div>
        </div>
      </div>

      <div class="slider-container">
        <input type="range" id="amount-slider" min="100000" max="100000000" value="10000000" step="100000">
      </div>

      <button class="proceed-btn" id="proceed-btn">Proceed</button>

      <div class="house-container">
        <img id="house-image" src="/houses/level1.png" alt="House" class="house-image">
        <img id="house-shadow" src="/houses/level1.png" alt="" class="house-shadow">
      </div>
    </div>
  </div>

  <script>
    if (!sessionStorage.getItem('zinc-flow-started')) {
      window.location.href = '/';
    }
  </script>
  <script type="module" src="planner-main.js"></script>
  <script src="/community-widget.js"></script>
</body>
</html>
