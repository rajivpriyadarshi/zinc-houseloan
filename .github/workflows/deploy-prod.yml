      #     SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      #   run: |
      #     curl -X POST -H 'Content-type: application/json' \
      #     --data '{
      #       "text": ":tada: Deployment succeeded for branch `${{ github.ref_name }}` in repository `${{ github.repository }}`.\n\n*Service:* `${{ env.SERVICE }}`\n*Environment:* `${{ env.ENVIRONMENT }}`"
      #     }' \
